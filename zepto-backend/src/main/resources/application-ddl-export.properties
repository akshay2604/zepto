# src/main/resources/application-ddl-export.properties
# Activate with: --spring.profiles.active=ddl-export
# After running, copy the generated file to db/migration/V1__init_schema.sql
# then switch back to the default profile (ddl-auto=validate + Flyway).

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

# Hibernate will write the CREATE TABLE DDL to this file on startup
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=src/main/resources/db/migration/V1__init_schema.sql
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
